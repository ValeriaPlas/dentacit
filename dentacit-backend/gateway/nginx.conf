# =====================================================================
# API Gateway de DentaCit (Nginx)
# Único punto de entrada para el cliente web y la app Android.
# Enruta cada prefijo /api/... al microservicio correspondiente.
# =====================================================================
upstream auth      { server auth-service:3000; }
upstream citas     { server citas-service:80; }
upstream catalogo  { server catalogo-service:80; }
upstream notif     { server notif-service:3001; }

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Authorization     $http_authorization;

    add_header X-Content-Type-Options nosniff always;

    # Limita intentos de login por IP (protección contra fuerza bruta)
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://auth;
    }
    location /api/auth/        { proxy_pass http://auth; }
    location /api/citas        { proxy_pass http://citas; }
    location /api/horarios     { proxy_pass http://citas; }
    location /api/servicios    { proxy_pass http://catalogo; }
    location = /api/qr         { proxy_pass http://notif; }

    # Las notificaciones solo se llaman entre servicios, nunca desde fuera.
    location /api/notificaciones { return 404; }

    location = /api/salud {
        default_type application/json;
        return 200 '{"servicio":"api-gateway","ok":true}';
    }

    # Cliente web del paciente (archivos estáticos)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
